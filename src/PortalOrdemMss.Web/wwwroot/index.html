<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de artigos</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="topo">
    <h1 id="titulo">Catálogo de artigos</h1>
    <span id="demo-badge" class="demo-badge" hidden>Modo demonstração</span>
    <div class="filtros">
      <input id="pesquisa" type="search" placeholder="Pesquisar por código ou nome" autocomplete="off">
      <select id="familia">
        <option value="">Todas as famílias</option>
      </select>
      <button id="btn-ordenar" class="btn" type="button" hidden>Ordenar</button>
    </div>
  </header>

  <div id="barra-ordenar" class="barra-ordenar" hidden>
    <span id="ordenar-info">Arrasta os artigos para a nova posição.</span>
    <button id="btn-cancelar" class="btn" type="button">Cancelar</button>
    <button id="btn-guardar" class="btn btn-principal" type="button" disabled>Guardar ordem</button>
  </div>

  <main>
    <p id="estado" class="estado" role="status"></p>
    <div id="grelha" class="grelha"></div>
    <button id="mais" class="mais" type="button" hidden>Carregar mais</button>
  </main>

  <template id="tpl-artigo">
    <article class="artigo">
      <div class="foto"><img alt="" loading="lazy" width="100" height="100"></div>
      <h2 class="nome"></h2>
      <p class="familia"></p>
      <p class="ordem"></p>
      <div class="controlos">
        <button type="button" data-mover="topo" title="Mover para o topo">⤒</button>
        <button type="button" data-mover="cima" title="Subir uma posição (↑)">↑</button>
        <button type="button" data-mover="baixo" title="Descer uma posição (↓)">↓</button>
        <button type="button" data-mover="fim" title="Mover para o fim">⤓</button>
      </div>
    </article>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
