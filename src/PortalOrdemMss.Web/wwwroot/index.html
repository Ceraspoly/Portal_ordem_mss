<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de artigos</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="topo">
    <h1 id="titulo">Catálogo de artigos</h1>
    <span id="demo-badge" class="demo-badge" hidden>Modo demonstração</span>
    <div class="filtros">
      <input id="pesquisa" type="search" placeholder="Pesquisar por código ou nome" autocomplete="off">
      <select id="familia">
        <option value="">Todas as famílias</option>
      </select>
      <button id="btn-ordenar" class="btn" type="button" hidden>Ordenar</button>
      <button id="btn-historico" class="btn" type="button" hidden>Histórico</button>
    </div>
  </header>

  <div id="barra-ordenar" class="barra-ordenar" hidden>
    <span id="ordenar-info">Arrasta os artigos para a nova posição.</span>
    <div class="vista" role="group" aria-label="Ver como">
      <button type="button" class="btn" data-vista="quadrados">Quadrados</button>
      <button type="button" class="btn" data-vista="lista">Lista</button>
    </div>
    <button id="btn-cancelar" class="btn" type="button">Cancelar</button>
    <button id="btn-guardar" class="btn btn-principal" type="button" disabled>Guardar ordem</button>
  </div>

  <main>
    <p id="estado" class="estado" role="status"></p>
    <div id="grelha" class="grelha"></div>
    <button id="mais" class="mais" type="button" hidden>Carregar mais</button>
  </main>

  <template id="tpl-artigo">
    <article class="artigo">
      <div class="foto"><img alt="" loading="lazy" width="100" height="100"></div>
      <h2 class="nome"></h2>
      <p class="familia"></p>
      <p class="ordem"></p>
      <div class="controlos">
        <button type="button" data-mover="topo" title="Mover para o topo">⤒</button>
        <button type="button" data-mover="cima" title="Subir uma posição (↑)">↑</button>
        <button type="button" data-mover="baixo" title="Descer uma posição (↓)">↓</button>
        <button type="button" data-mover="fim" title="Mover para o fim">⤓</button>
        <button type="button" data-mover="depois" class="btn-depois" title="Mover para a seguir a outro artigo">↪ A seguir a…</button>
      </div>
    </article>
  </template>

  <dialog id="dlg-mover" class="dlg-mover">
    <form id="form-mover" method="dialog">
      <p class="dlg-titulo">Mover <strong id="mover-nome"></strong> para a seguir a:</p>
      <input id="mover-alvo" list="lista-alvos" placeholder="Escreve o código ou o nome do artigo" autocomplete="off" required>
      <datalist id="lista-alvos"></datalist>
      <p id="mover-erro" class="mover-erro" hidden></p>
      <div class="dlg-botoes">
        <button type="button" id="mover-inicio" class="btn">Para o início</button>
        <button type="button" id="mover-cancelar" class="btn">Cancelar</button>
        <button type="submit" class="btn btn-principal">Mover</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-historico" class="dlg-historico">
    <div class="historico-topo">
      <h2>Últimas 15 gravações</h2>
      <button type="button" id="historico-fechar" class="btn">Fechar</button>
    </div>
    <p id="historico-estado" class="historico-estado"></p>
    <ol id="historico-lista" class="historico-lista"></ol>
  </dialog>

  <dialog id="dlg-codigo" class="dlg-mover">
    <form id="form-codigo" method="dialog">
      <p class="dlg-titulo">Código para gravar a ordem:</p>
      <input id="codigo-escrita" type="password" autocomplete="off" required>
      <p id="codigo-erro" class="mover-erro" hidden></p>
      <div class="dlg-botoes">
        <button type="button" id="codigo-cancelar" class="btn">Cancelar</button>
        <button type="submit" class="btn btn-principal">Gravar</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
